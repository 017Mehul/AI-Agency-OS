<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agency OS · MG Labs Co</title><link rel="stylesheet" href="/styles.css"></head>
<body><div id="app"><div class="boot">Loading AI Agency OS…</div></div>
<script>
const state={token:sessionStorage.getItem("aaos_token")||"",config:null};const $=s=>document.querySelector(s);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
async function api(path,opts={}){const h={"Content-Type":"application/json",...(opts.headers||{})};if(state.token)h.Authorization="Bearer "+state.token;const r=await fetch(path,{...opts,headers:h});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw new Error(d.error||"Request failed");return d;}
async function boot(){const health=await api("/api/health");state.config=health.config;if(!state.token)return login();try{await api("/api/dashboard");render()}catch{signOut();login("Your session expired. Please sign in again.")}}
function signOut(){sessionStorage.removeItem("aaos_token");localStorage.removeItem("aaos_token");state.token="";}
function login(msg=""){document.querySelector("#app").innerHTML='<main class="auth"><div class="brand">MG LABS CO</div><h1>AI Agency OS</h1><p>Autonomous operations for AI agencies.</p><form id="login"><input id="email" type="email" placeholder="Email" autocomplete="email" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in</button></form><div class="muted">'+esc(msg||"Use your Supabase account.")+"</div></main>";$("#login").onsubmit=async e=>{e.preventDefault();try{if(!state.config?.supabaseUrl||!state.config?.supabasePublishableKey)throw new Error("Supabase client configuration is missing");const r=await fetch(state.config.supabaseUrl+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":state.config.supabasePublishableKey},body:JSON.stringify({email:$("#email").value,password:$("#password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||"Login failed");state.token=d.access_token;sessionStorage.setItem("aaos_token",state.token);render()}catch(x){login(x.message)}}}
async function render(){document.querySelector("#app").innerHTML='<div class="layout"><aside><div class="brand">MG LABS CO</div><h2>AI Agency OS</h2><nav><button data-tab="overview">Overview</button><button data-tab="missions">Missions</button><button data-tab="leads">Leads</button><button data-tab="proposals">Proposals</button><button data-tab="approvals">Approvals</button></nav><button id="logout" class="ghost">Sign out</button></aside><main class="main"><header><div><span class="eyebrow">CONTROL PLANE</span><h1 id="title">Overview</h1></div><span class="status">SYSTEM ONLINE</span></header><section id="content"></section></main></div>';document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>load(b.dataset.tab));$("#logout").onclick=()=>{signOut();login()};load("overview")}
function cards(metrics){return '<div class="cards">'+Object.entries(metrics||{}).map(([k,v])=>'<article><small>'+esc(k.replaceAll("_"," "))+'</small><strong>'+esc(v)+'</strong></article>').join("")+"</div>";}
async function load(tab){$("#title").textContent=tab[0].toUpperCase()+tab.slice(1);const c=$("#content");c.innerHTML='<div class="loading">Loading…</div>';try{if(tab==="overview"){const d=await api("/api/dashboard");c.innerHTML=cards(d.metrics)+'<div class="panel"><h3>Recent agent events</h3>'+((d.recent_events||[]).map(x=>'<div class="event"><b>'+esc(x.event_type)+'</b><span>'+esc(x.message)+'</span></div>').join("")||'<p class="muted">No events yet.</p>')+"</div>";}
else if(tab==="missions"){const d=await api("/api/dashboard");c.innerHTML='<div class="panel"><h3>Mission engine</h3><p>Dependency-aware execution, QA, retries and human approval gates are active.</p>'+cards({missions:d.metrics?.missions||0,tasks:d.metrics?.tasks||0,agent_runs:d.metrics?.agent_runs||0})+"</div>";}
else if(tab==="leads"){const d=await api("/api/leads?limit=100");c.innerHTML='<div class="panel"><h3>Lead pipeline</h3><table><tr><th>Company</th><th>Status</th><th>Industry</th></tr>'+d.leads.map(x=>'<tr><td>'+esc(x.company_name)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.industry||"—")+'</td></tr>').join("")+"</table></div>";}
else if(tab==="proposals"){const d=await api("/api/proposals?limit=100");c.innerHTML='<div class="panel"><h3>Proposals</h3><table><tr><th>Subject</th><th>Service</th><th>Status</th></tr>'+d.proposals.map(x=>'<tr><td>'+esc(x.subject)+'</td><td>'+esc(x.service)+'</td><td>'+esc(x.status)+'</td></tr>').join("")+"</table></div>";}
else {const d=await api("/api/approvals?status=pending");c.innerHTML='<div class="panel"><h3>Pending approvals</h3>'+((d.approvals||[]).map(x=>'<div class="approval"><div><b>'+esc(x.action)+'</b><small>'+esc(x.reason)+'</small></div><div><button data-approval-id="'+esc(x.id)+'" data-approval-action="approve">Approve</button><button class="danger" data-approval-id="'+esc(x.id)+'" data-approval-action="reject">Reject</button></div></div>').join("")||'<p class="muted">Nothing waiting for approval.</p>')+"</div>";document.querySelectorAll("[data-approval-id]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("/api/approvals",{method:"POST",body:JSON.stringify({id:b.dataset.approvalId,action:b.dataset.approvalAction})});load("approvals")}catch(e){alert(e.message);b.disabled=false}});}}
catch(e){c.innerHTML='<div class="panel error">'+esc(e.message)+"</div>";}}
boot().catch(e=>{document.querySelector("#app").innerHTML='<main class="auth"><h1>Configuration error</h1><p>'+esc(e.message)+"</p></main>"});
</script></body></html>
