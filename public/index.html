<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0d"><title>MG Labs Co · AI Agency OS</title><link rel="stylesheet" href="/styles.css"></head>
<body><div id="app"><div class="boot"><div class="boot-mark">MG</div><span>Initializing agency OS</span></div></div>
<script>
const state={token:sessionStorage.getItem("aaos_token")||"",refreshToken:sessionStorage.getItem("aaos_refresh_token")||"",config:null,tab:"overview",refreshing:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function refreshSession(){if(!state.refreshToken||!state.config?.supabaseUrl||state.refreshing)return state.refreshing;state.refreshing=(async()=>{const r=await fetch(state.config.supabaseUrl+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json","apikey":state.config.supabasePublishableKey},body:JSON.stringify({refresh_token:state.refreshToken})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw Error(d.error_description||"Session refresh failed");state.token=d.access_token;state.refreshToken=d.refresh_token||state.refreshToken;sessionStorage.setItem("aaos_token",state.token);sessionStorage.setItem("aaos_refresh_token",state.refreshToken);return state.token})().finally(()=>{state.refreshing=null});return state.refreshing}
async function api(path,opts={},retry=true){const h={"Content-Type":"application/json",...(opts.headers||{})};if(state.token)h.Authorization="Bearer "+state.token;const r=await fetch(path,{...opts,headers:h});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok&&retry&&r.status===401&&state.refreshToken){await refreshSession();return api(path,opts,false)}if(!r.ok)throw Error(d.error||"Request failed");return d}
function signOut(){sessionStorage.removeItem("aaos_token");sessionStorage.removeItem("aaos_refresh_token");state.token="";state.refreshToken="";login()}
function login(msg=""){document.body.className="auth-mode";$("#app").innerHTML='<main class="auth-screen"><div class="auth-glow"></div><section class="auth-card"><div class="auth-logo">MG<span>LABS</span></div><div class="auth-kicker">AUTONOMOUS OPERATIONS</div><h1>Run your agency<br><i>at machine speed.</i></h1><p>Mission orchestration, AI agents, approvals and growth operations in one command center.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="email" placeholder="you@company.com" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required></label><button class="btn primary full">Enter control plane <b>↗</b></button></form><div class="auth-msg">'+esc(msg||"Secure Supabase authentication")+'</div></section></main>';$("#login").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const r=await fetch(state.config.supabaseUrl+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":state.config.supabasePublishableKey},body:JSON.stringify({email:$("#email").value,password:$("#password").value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||"Login failed");state.token=d.access_token;state.refreshToken=d.refresh_token||"";sessionStorage.setItem("aaos_token",state.token);if(state.refreshToken)sessionStorage.setItem("aaos_refresh_token",state.refreshToken);document.body.className="";render()}catch(x){b.disabled=false;login(x.message)}}}
function shell(){return '<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-symbol">MG</div><div><strong>MG LABS CO</strong><small>AI AGENCY OS</small></div></div><div class="side-label">COMMAND CENTER</div><nav>'+nav("overview","⌂","Overview")+nav("missions","◈","Missions")+nav("leads","◉","Leads")+nav("proposals","◇","Proposals")+nav("approvals","✓","Approvals")+'</nav><div class="sidebar-bottom"><div class="online"><i></i><div><b>ALL SYSTEMS</b><small>Operational</small></div><span>●</span></div><button id="logout" class="profile"><span class="avatar">MG</span><span><b>Workspace</b><small>Authenticated</small></span><em>↗</em></button></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">MG LABS / CONTROL PLANE</div><h1 id="page-title">Overview</h1></div><div class="top-right"><div class="pulse"><i></i>LIVE</div><button id="refresh" class="icon-btn" title="Refresh">↻</button></div></header><div id="content"></div></main></div>'}
function nav(id,icon,label){return '<button class="nav '+(state.tab===id?"active":"")+'" data-tab="'+id+'"><span>'+icon+'</span>'+label+(id==="approvals"?'<em id="approval-count"></em>':"")+'</button>'}
function metric(icon,label,value,sub){return '<article class="metric reveal"><div class="metric-icon">'+icon+'</div><div><small>'+label+'</small><strong>'+esc(value)+'</strong><span>'+sub+'</span></div></article>'}
function status(s){return '<span class="status '+String(s||"").replaceAll("_","-")+'">'+esc(s||"unknown")+'</span>'}
function empty(icon,title,text){return '<div class="empty"><div class="empty-icon">'+icon+'</div><h3>'+title+'</h3><p>'+text+'</p></div>'}
async function overview(){const d=await api("/api/dashboard"),m=d.metrics||{};return '<section class="hero reveal"><div class="hero-copy"><div class="hero-kicker"><i></i>AUTONOMOUS AGENCY INFRASTRUCTURE</div><h2>Turn ideas into <span>execution.</span></h2><p>Coordinate AI agents, missions, approvals and growth workflows from one intelligent operating layer.</p><div class="hero-actions"><button class="btn primary" data-tab="missions">Launch mission <b>↗</b></button><button class="btn ghost" data-tab="approvals">Review approvals <b>→</b></button></div></div><div class="hero-visual"><div class="orbital o1"></div><div class="orbital o2"></div><div class="orb-core"><span>MG</span><i></i></div><div class="orbit-label l1">AGENTS</div><div class="orbit-label l2">AI</div></div></section><div class="metrics">'+metric("◈","MISSIONS",m.missions||0,"orchestrated")+metric("◌","TASKS",m.tasks||0,"queued & executed")+metric("✦","AGENT RUNS",m.agent_runs||0,"intelligence calls")+metric("✓","APPROVALS",m.approvals||0,"human checkpoints")+'</div><section class="section reveal"><div class="section-head"><div><div class="eyebrow">ACTIVITY STREAM</div><h2>What the system is doing</h2></div><span class="live-label"><i></i>REAL TIME</span></div><div class="panel activity">'+((d.recent_events||[]).map((x,i)=>'<div class="activity-row"><span class="activity-line"></span><div class="event-type">'+esc(x.event_type||"EVENT")+'</div><div class="event-main"><b>'+esc(x.message||"Agent event")+'</b><small>Mission execution event</small></div><time>'+new Date(x.created_at||Date.now()).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+'</time></div>').join("")||empty("✦","No activity yet","Your agency events will appear here as agents execute work."))+'</div></section>'}
async function missions(){const d=await api("/api/missions");const arr=d.missions||[];return '<section class="page-head reveal"><div><div class="eyebrow">ORCHESTRATION</div><h2>Mission control</h2><p>Deploy work to your autonomous agent workforce.</p></div><button class="btn primary" id="new-mission">+ New mission</button></section><div class="mission-grid">'+(arr.map((x,i)=>{const runnable=["planning_complete","running","waiting_approval"].includes(x.status);return '<article class="mission-card reveal" style="--delay:'+(i*45)+'ms"><div class="card-top"><span class="mini-id">MISSION / '+String(i+1).padStart(2,"0")+'</span>'+status(x.status)+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.goal||"No mission goal provided.")+'</p><div class="card-foot"><span>'+new Date(x.created_at||Date.now()).toLocaleDateString()+'</span><button class="btn ghost mission-run-btn" data-mission-run="'+esc(x.id)+'" '+(runnable?"":"disabled")+">'+(x.status==="waiting_approval"?"Waiting for approval":x.status==="planning_complete"?"Run mission":"Continue")+' <b>↗</b></button></div></article>'}).join("")||empty("◈","No missions yet","Create your first mission and let the OS orchestrate the work."))+'</div>'}
async function leads(){const d=await api("/api/leads?limit=100"),arr=d.leads||[];return '<section class="page-head reveal"><div><div class="eyebrow">GROWTH ENGINE</div><h2>Lead intelligence</h2><p>Qualified opportunities flowing through your agency.</p></div></section><div class="panel table-panel reveal">'+(arr.length?'<div class="table-wrap"><table><thead><tr><th>Company</th><th>Status</th><th>Industry</th><th>Created</th></tr></thead><tbody>'+arr.map(x=>'<tr><td><b>'+esc(x.company_name)+'</b><small>'+esc(x.website||"No website")+'</small></td><td>'+status(x.status)+'</td><td>'+esc(x.industry||"—")+'</td><td>'+new Date(x.created_at||Date.now()).toLocaleDateString()+'</td></tr>').join("")+'</tbody></table></div>':empty("◉","Pipeline is clear","Lead discovery will surface opportunities here."))+'</div>'}
async function proposals(){const d=await api("/api/proposals?limit=100"),arr=d.proposals||[];return '<section class="page-head reveal"><div><div class="eyebrow">REVENUE ENGINE</div><h2>Proposal pipeline</h2><p>AI-assisted proposals moving toward revenue.</p></div></section><div class="panel table-panel reveal">'+(arr.length?'<div class="table-wrap"><table><thead><tr><th>Subject</th><th>Service</th><th>Status</th><th>Created</th></tr></thead><tbody>'+arr.map(x=>'<tr><td><b>'+esc(x.subject||"Untitled")+'</b></td><td>'+esc(x.service||"—")+'</td><td>'+status(x.status)+'</td><td>'+new Date(x.created_at||Date.now()).toLocaleDateString()+'</td></tr>').join("")+'</tbody></table></div>':empty("◇","No proposals yet","Your proposal pipeline will appear here."))+'</div>'}
async function approvals(){const d=await api("/api/approvals?status=pending"),arr=d.approvals||[];return '<section class="page-head reveal"><div><div class="eyebrow">HUMAN-IN-THE-LOOP</div><h2>Approval center</h2><p>Nothing irreversible happens without your authorization.</p></div><span class="security-badge">⌁ HUMAN GATE ACTIVE</span></section><div class="approval-list">'+(arr.map((x,i)=>'<article class="approval-card reveal" style="--delay:'+(i*55)+'ms"><div class="approval-symbol">!</div><div class="approval-body"><div class="approval-meta"><span>PENDING REVIEW</span><time>'+new Date(x.created_at||Date.now()).toLocaleString()+'</time></div><h3>'+esc(x.action||"External action")+'</h3><p>'+esc(x.reason||"This action requires human approval before execution.")+'</p><small>ID · '+esc(x.id)+'</small></div><div class="approval-actions"><button class="btn ghost" data-approval-id="'+esc(x.id)+'" data-approval-action="reject">Reject</button><button class="btn primary" data-approval-id="'+esc(x.id)+'" data-approval-action="approve">Approve <b>✓</b></button></div></article>').join("")||empty("✓","All clear","No actions are waiting for your approval."))+'</div>'}
async function load(tab){state.tab=tab;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#page-title").textContent={overview:"Overview",missions:"Missions",leads:"Leads",proposals:"Proposals",approvals:"Approvals"}[tab];const c=$("#content");c.classList.remove("page-enter");void c.offsetWidth;c.classList.add("page-enter");c.innerHTML='<div class="loading"><span></span><span>Loading '+tab+'…</span></div>';try{c.innerHTML=await ({overview,missions,leads,proposals,approvals}[tab])();bind()}catch(e){c.innerHTML='<div class="panel error reveal"><b>Unable to load this view</b><p>'+esc(e.message)+'</p></div>'}}
function missionModal(){if($("#mission-modal"))return;const m=document.createElement("div");m.id="mission-modal";m.className="modal-backdrop";m.innerHTML='<section class="mission-modal" role="dialog" aria-modal="true" aria-labelledby="mission-modal-title"><button class="modal-close" id="mission-close" aria-label="Close">×</button><div class="modal-kicker">MISSION DEPLOYMENT</div><h2 id="mission-modal-title">Create a new mission</h2><p class="modal-copy">Define the outcome. The Orchestrator will turn it into a dependency-aware task plan using your active agents.</p><form id="mission-form"><div class="form-grid"><label>Mission title<input id="mission-title" maxlength="120" placeholder="e.g. Audit our landing page" required></label><label>Priority<select id="mission-priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></label></div><label>Goal<textarea id="mission-goal" maxlength="2000" rows="5" placeholder="What should the agency accomplish? Be specific about the desired outcome." required></textarea></label><div class="form-grid"><label>Services / capabilities<input id="mission-services" maxlength="500" placeholder="research, website audit, automation"></label><label>Target count<input id="mission-target" type="number" min="0" max="100000" value="0"></label></div><div class="modal-footer"><span id="mission-status" class="form-status">Planning runs through the live backend.</span><div><button type="button" class="btn ghost" id="mission-cancel">Cancel</button><button type="submit" class="btn primary" id="mission-submit">Create & plan <b>↗</b></button></div></div></form></section>';document.body.appendChild(m);const close=()=>m.remove();$("#mission-close").onclick=close;$("#mission-cancel").onclick=close;m.addEventListener("click",e=>{if(e.target===m)close()});$("#mission-form").onsubmit=async e=>{e.preventDefault();const btn=$("#mission-submit"),msg=$("#mission-status");btn.disabled=true;msg.textContent="Creating mission…";try{const title=$("#mission-title").value.trim(),goal=$("#mission-goal").value.trim(),services=$("#mission-services").value.split(",").map(x=>x.trim()).filter(Boolean),priority=$("#mission-priority").value,target_count=Math.max(0,Number($("#mission-target").value)||0);const created=await api("/api/missions",{method:"POST",body:JSON.stringify({action:"create",title,goal,services,priority,target_count})});msg.textContent="Mission created. Building execution plan…";const planned=await api("/api/missions",{method:"POST",body:JSON.stringify({action:"plan",id:created.mission.id})});close();await load("missions");const card=document.querySelector(".mission-card");if(card){card.classList.add("mission-highlight");setTimeout(()=>card.classList.remove("mission-highlight"),1600)}alert("Mission created and planned successfully. "+(planned.tasks?.length||0)+" task(s) ready.");}catch(err){msg.textContent=err.message||"Unable to create mission.";btn.disabled=false}}}
function bind(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>load(b.dataset.tab));document.querySelectorAll("[data-approval-id]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("/api/approvals",{method:"POST",body:JSON.stringify({id:b.dataset.approvalId,action:b.dataset.approvalAction})});load("approvals")}catch(e){alert(e.message);b.disabled=false}});document.querySelectorAll("[data-mission-run]").forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent="Starting…";try{const d=await api("/api/mission-run",{method:"POST",body:JSON.stringify({id:b.dataset.missionRun})});await load("missions");if(d.status==="waiting_approval"){await load("approvals");alert("Mission is waiting for your approval. Open Approvals to review it.");}else{alert("Mission execution started. Status: "+(d.status||"running"));}}catch(e){alert(e.message||"Unable to run mission.");b.disabled=false}});const n=$("#new-mission");if(n)n.onclick=missionModal}
async function render(){document.body.className="";$("#app").innerHTML=shell();$("#logout").onclick=signOut;$("#refresh").onclick=()=>load(state.tab);bind();await load(state.tab)}
async function boot(){const h=await api("/api/health");state.config=h.config;if(!state.token){login();return}try{await api("/api/dashboard");await render()}catch{signOut();login("Your session expired. Please sign in again.")}}
boot().catch(e=>{$("#app").innerHTML='<main class="auth-screen"><section class="auth-card"><h1>Control plane unavailable</h1><p>'+esc(e.message)+'</p></section></main>'});
</script></body></html>
