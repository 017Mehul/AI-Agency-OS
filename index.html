<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agency OS · MG Labs Co</title><link rel="stylesheet" href="/styles.css"></head>
<body><div id="app"><div class="boot">Loading AI Agency OS…</div></div>
<script>
const state={token:localStorage.getItem("aaos_token")||"",config:null};
const $=s=>document.querySelector(s);
async function api(path,opts={}){const h={"Content-Type":"application/json",...(opts.headers||{})};if(state.token)h.Authorization="Bearer "+state.token;const r=await fetch(path,{...opts,headers:h});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function boot(){const health=await api("/api/health");state.config=health.config;if(!state.token)return login();try{await api("/api/dashboard");render()}catch{state.token="";localStorage.removeItem("aaos_token");login()}}
function login(msg=""){document.querySelector("#app").innerHTML='<main class="auth"><div class="brand">MG LABS CO</div><h1>AI Agency OS</h1><p>Autonomous operations for AI agencies.</p><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><div class="muted">'+(msg||"Use your Supabase account.")+'</div></main>';$("#login").onsubmit=async e=>{e.preventDefault();try{const r=await fetch(state.config.supabaseUrl+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":state.config.supabasePublishableKey},body:JSON.stringify({email:$("#email").value,password:$("#password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||"Login failed");state.token=d.access_token;localStorage.setItem("aaos_token",state.token);render()}catch(x){login(x.message)}}}
async function render(){document.querySelector("#app").innerHTML='<div class="layout"><aside><div class="brand">MG LABS CO</div><h2>AI Agency OS</h2><nav><button data-tab="overview">Overview</button><button data-tab="missions">Missions</button><button data-tab="leads">Leads</button><button data-tab="proposals">Proposals</button><button data-tab="approvals">Approvals</button></nav><button id="logout" class="ghost">Sign out</button></aside><main class="main"><header><div><span class="eyebrow">CONTROL PLANE</span><h1 id="title">Overview</h1></div><span class="status">SYSTEM ONLINE</span></header><section id="content"></section></main></div>';document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>load(b.dataset.tab));$("#logout").onclick=()=>{localStorage.removeItem("aaos_token");state.token="";login()};load("overview")}
async function load(tab){$("#title").textContent=tab[0].toUpperCase()+tab.slice(1);const c=$("#content");c.innerHTML='<div class="loading">Loading…</div>';try{if(tab==="overview"){const d=await api("/api/dashboard");c.innerHTML='<div class="cards">'+Object.entries(d.counts||{}).map(([k,v])=>'<article><small>'+k.replaceAll("_"," ")+'</small><strong>'+v+'</strong></article>').join("")+'</div><div class="panel"><h3>Recent agent events</h3>'+((d.recent_events||[]).map(x=>'<div class="event"><b>'+x.event_type+'</b><span>'+x.message+'</span></div>').join("")||'<p class="muted">No events yet.</p>')+'</div>'}
else if(tab==="missions"){const d=await api("/api/dashboard");c.innerHTML='<div class="panel"><h3>Mission engine</h3><p>Mission planning, dependency-aware execution, QA, approval gating and retries are active.</p><div class="cards"><article><small>Active</small><strong>'+d.counts.missions+'</strong></article><article><small>Tasks</small><strong>'+d.counts.mission_tasks+'</strong></article><article><small>Agent runs</small><strong>'+d.counts.agent_runs+'</strong></article></div></div>'}
else if(tab==="leads"){const d=await api("/api/leads?limit=100");c.innerHTML='<div class="panel"><h3>Lead pipeline</h3><table><tr><th>Company</th><th>Status</th><th>Service context</th></tr>'+d.leads.map(x=>'<tr><td>'+esc(x.company_name)+'</td><td>'+x.status+'</td><td>'+esc(x.industry||"—")+'</td></tr>').join("")+'</table></div>'}
else if(tab==="proposals"){const d=await api("/api/proposals?limit=100");c.innerHTML='<div class="panel"><h3>Proposals</h3><table><tr><th>Subject</th><th>Service</th><th>Status</th></tr>'+d.proposals.map(x=>'<tr><td>'+esc(x.subject)+'</td><td>'+x.service+'</td><td>'+x.status+'</td></tr>').join("")+'</table></div>'}
else {const d=await api("/api/approvals?status=pending");c.innerHTML='<div class="panel"><h3>Pending approvals</h3>'+((d.approvals||[]).map(x=>'<div class="approval"><div><b>'+x.action+'</b><small>'+x.reason+'</small></div><div><button onclick="resolveApproval(\''+x.id+'\',\'approve\')">Approve</button><button class="danger" onclick="resolveApproval(\''+x.id+'\',\'reject\')">Reject</button></div></div>').join("")||'<p class="muted">Nothing waiting for approval.</p>')+'</div>'}}catch(e){c.innerHTML='<div class="panel error">'+esc(e.message)+'</div>'}}
async function resolveApproval(id,action){await api("/api/approvals",{method:"POST",body:JSON.stringify({id,action})});load("approvals")}
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
boot().catch(e=>{document.querySelector("#app").innerHTML='<main class="auth"><h1>Configuration error</h1><p>'+esc(e.message)+'</p></main>'});
</script></body></html>
