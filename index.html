<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agency OS · MG Labs Co</title><link rel="stylesheet" href="/styles.css"></head>
<body><div id="app"><div class="boot"><div class="spinner"></div><span>Loading control plane…</span></div></div><script>
const state={token:sessionStorage.getItem('aaos_token')||'',config:null,tab:'overview'};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=v=>v?new Intl.DateTimeFormat('en-IN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';const cap=v=>String(v||'').replaceAll('_',' ').replace(/\b\w/g,x=>x.toUpperCase());const sc=v=>String(v||'').toLowerCase().replaceAll('_','-');
async function api(path,o={}){const h={'Content-Type':'application/json',...(o.headers||{})};if(state.token)h.Authorization='Bearer '+state.token;const r=await fetch(path,{...o,headers:h}),t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function logout(){sessionStorage.removeItem('aaos_token');localStorage.removeItem('aaos_token');state.token=''}
async function boot(){const h=await api('/api/health');state.config=h.config;if(!state.token)return login();try{await api('/api/dashboard');render()}catch{logout();login('Your session expired. Sign in again.')}}
function login(msg=''){app.innerHTML='<main class="auth-shell"><div class="auth-card"><div class="logo-mark">MG</div><div class="brand">MG LABS CO <span>•</span> CONTROL PLANE</div><h1>AI Agency OS</h1><p class="lead">Autonomous operations, with a human in the loop when it matters.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="email" placeholder="you@company.com" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required></label><button class="primary wide">Enter workspace <b>→</b></button></form><div class="auth-note">'+esc(msg||'Sign in with your Supabase account.')+'</div></div></main>';$('#login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(state.config.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':state.config.supabasePublishableKey},body:JSON.stringify({email:$('#email').value,password:$('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.error_description||'Login failed');state.token=d.access_token;sessionStorage.setItem('aaos_token',state.token);render()}catch(x){login(x.message)}}}
const nav=[['overview','Overview','⌂'],['missions','Missions','◈'],['approvals','Approvals','✓'],['leads','Leads','◎'],['proposals','Proposals','▣']];
function render(){app.innerHTML='<div class="app-shell"><aside class="sidebar"><div class="brand-row"><div class="logo-mark tiny">MG</div><div><b>MG Labs Co</b><span>AI Agency OS</span></div></div><div class="workspace">WORKSPACE <i></i></div><nav>'+nav.map(n=>'<button class="nav-item '+(state.tab===n[0]?'active':'')+'" data-tab="'+n[0]+'"><span>'+n[2]+'</span>'+n[1]+'<em id="nav-'+n[0]+'"></em></button>').join('')+'</nav><div class="side-bottom"><div class="system-chip"><i></i><div><b>System online</b><small>Production control plane</small></div></div><button id="logout" class="user-button"><span class="avatar">MG</span><span><b>Workspace owner</b><small>Authenticated</small></span>↗</button></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">CONTROL PLANE / '+cap(state.tab)+'</div><h1>'+cap(state.tab)+'</h1></div><div class="top-actions"><button class="icon-btn" id="refresh">↻</button><span class="live"><i></i> LIVE</span></div></header><section id="content"></section></main></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('#logout').onclick=()=>{logout();login()};$('#refresh').onclick=()=>load(state.tab);load(state.tab)}
const metric=(a,b,c,d)=>'<article class="metric"><div class="metric-head"><span>'+d+'</span><small>'+esc(a)+'</small></div><strong>'+esc(b)+'</strong><div class="metric-sub">'+esc(c)+'</div></article>';const empty=(i,t,p)=>'<div class="empty"><div>'+i+'</div><h3>'+t+'</h3><p>'+p+'</p></div>';
async function load(tab){const c=$('#content');c.innerHTML='<div class="loading"><div class="spinner"></div>Loading workspace…</div>';try{if(tab==='overview'){const d=await api('/api/dashboard'),m=d.metrics||{};c.innerHTML='<div class="hero"><div><span class="hero-kicker">AUTONOMOUS OPERATIONS</span><h2>Your agency is <span>running.</span></h2><p>Monitor missions, approve sensitive actions and keep every agent accountable.</p></div><div class="hero-orbit"><div class="core">MG</div><i></i><i></i></div></div><div class="metrics-grid">'+metric('Missions',m.missions||0,'Owned missions','◈')+metric('Pending approvals',m.pending_approvals||0,m.pending_approvals?'Action required':'All clear','✓')+metric('Tasks',m.tasks||0,'Across missions','◇')+metric('Agent runs',m.agent_runs||0,'Execution history','↗')+'</div><div class="section-head"><div><span class="eyebrow">ACTIVITY</span><h2>Recent events</h2></div></div><div class="panel event-panel">'+((d.recent_events||[]).map(x=>'<div class="event-row"><i class="event-dot"></i><div><b>'+esc(cap(x.event_type))+'</b><p>'+esc(x.message||'')+'</p></div><time>'+fmt(x.created_at)+'</time></div>').join('')||empty('✦','No activity yet','Agent events will appear here.'))+'</div>'}
else if(tab==='approvals'){const d=await api('/api/approvals?status=pending'),rows=d.approvals||[];$('#nav-approvals').textContent=rows.length||'';c.innerHTML='<div class="page-intro"><div><span class="eyebrow">HUMAN OVERSIGHT</span><h2>Approval center</h2><p>Nothing sensitive moves without your explicit decision.</p></div><span class="count-badge">'+rows.length+' pending</span></div><div class="approval-list">'+(rows.map(x=>'<article class="approval-card"><div class="approval-icon">!</div><div class="approval-main"><div class="approval-title"><span class="pill warning">REQUIRES APPROVAL</span><time>'+fmt(x.created_at)+'</time></div><h3>'+esc(x.action||'External action')+'</h3><p>'+esc(x.reason||'This action requires human approval.')+'</p><div class="approval-meta"><span>Mission <b>'+esc(x.mission_id||'—')+'</b></span><span>Task <b>'+esc(x.task_id||'—')+'</b></span></div></div><div class="approval-actions"><button class="primary" data-approve="'+esc(x.id)+'">Approve</button><button class="secondary danger" data-reject="'+esc(x.id)+'">Reject</button></div></article>').join('')||empty('✓','Queue is clear','There are no actions waiting for approval.'))+'</div>';document.querySelectorAll('[data-approve],[data-reject]').forEach(b=>b.onclick=()=>resolve(b.dataset.approve||b.dataset.reject,b.dataset.approve?'approve':'reject',b))}
else if(tab==='missions'){const d=await api('/api/missions'),rows=d.missions||[];c.innerHTML='<div class="page-intro"><div><span class="eyebrow">ORCHESTRATION</span><h2>Missions</h2><p>Dependency-aware agent work, retries, QA and approvals.</p></div><button class="primary" id="new-mission">+ New mission</button></div><div class="mission-grid">'+(rows.map(x=>'<article class="mission-card"><div class="mission-top"><span class="status-pill '+sc(x.status)+'">'+esc(cap(x.status))+'</span><span>'+esc(x.priority||'normal')+'</span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.goal||'No goal provided.')+'</p><div class="mission-foot"><span>'+fmt(x.created_at)+'</span><b>'+esc(x.id).slice(0,8)+'…</b></div></article>').join('')||empty('◈','No missions yet','Create your first mission to start orchestrating work.'))+'</div>';$('#new-mission').onclick=async()=>{const title=prompt('Mission title');if(!title)return;const goal=prompt('Mission goal');if(!goal)return;try{await api('/api/missions',{method:'POST',body:JSON.stringify({action:'create',title,goal,services:[]})});load('missions')}catch(e){alert(e.message)}}}
else if(tab==='leads'){const d=await api('/api/leads?limit=100');c.innerHTML='<div class="page-intro"><div><span class="eyebrow">PIPELINE</span><h2>Leads</h2><p>Prospects discovered and enriched by your agency.</p></div><span class="count-badge">'+(d.leads?.length||0)+' records</span></div><div class="panel table-wrap"><table><thead><tr><th>Company</th><th>Status</th><th>Industry</th><th>Source</th><th>Created</th></tr></thead><tbody>'+((d.leads||[]).map(x=>'<tr><td><b>'+esc(x.company_name)+'</b><small>'+esc(x.domain||x.website||'')+'</small></td><td><span class="status-pill '+sc(x.status)+'">'+esc(cap(x.status))+'</span></td><td>'+esc(x.industry||'—')+'</td><td>'+esc(x.source||'—')+'</td><td>'+fmt(x.created_at)+'</td></tr>').join('')||'<tr><td colspan="5">No leads yet.</td></tr>')+'</tbody></table></div>'}
else if(tab==='proposals'){const d=await api('/api/proposals?limit=100');c.innerHTML='<div class="page-intro"><div><span class="eyebrow">REVENUE</span><h2>Proposals</h2><p>Commercial work generated by your agency.</p></div><span class="count-badge">'+(d.proposals?.length||0)+' records</span></div><div class="panel table-wrap"><table><thead><tr><th>Subject</th><th>Service</th><th>Status</th><th>Created</th></tr></thead><tbody>'+((d.proposals||[]).map(x=>'<tr><td><b>'+esc(x.subject||'Untitled')+'</b></td><td>'+esc(x.service||'—')+'</td><td><span class="status-pill '+sc(x.status)+'">'+esc(cap(x.status))+'</span></td><td>'+fmt(x.created_at)+'</td></tr>').join('')||'<tr><td colspan="4">No proposals yet.</td></tr>')+'</tbody></table></div>'}}catch(e){c.innerHTML='<div class="panel error"><b>Couldn’t load this view</b><p>'+esc(e.message)+'</p><button class="secondary" onclick="load(\''+esc(tab)+'\')">Try again</button></div>'}}
async function resolve(id,action,b){const old=b.innerHTML;b.disabled=true;b.innerHTML='<span class="spinner small"></span>';try{await api('/api/approvals',{method:'POST',body:JSON.stringify({id,action})});load('approvals')}catch(e){alert(e.message);b.disabled=false;b.innerHTML=old}}
boot().catch(e=>{app.innerHTML='<main class="auth-shell"><div class="auth-card"><div class="logo-mark">!</div><h1>Configuration error</h1><p>'+esc(e.message)+'</p></div></main>'});</script></body></html>
